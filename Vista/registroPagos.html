<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial y Registro de Pagos - Club Acerías</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>

<body class="bg-light">
    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="text-danger fw-bold mb-0">Gestión de Pagos de Cuotas</h3>
            <a href="dashboard.html" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left"></i> Volver al Panel
            </a>
        </div>

        <div id="mensajeAlerta" class="alert d-none" role="alert"></div>

        <div class="row g-4">
            <!-- Formulario de Pago -->
            <div class="col-lg-4">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-danger text-white">
                        <h5 class="card-title mb-0">
                            <i class="bi bi-wallet2 me-1"></i> Registrar Pago de Cuota
                        </h5>
                    </div>
                    <div class="card-body">
                        <form id="formPago">
                            <div class="mb-3">
                                <label for="idPrestamo" class="form-label fw-semibold">Préstamo a Pagar</label>
                                <select class="form-select" id="idPrestamo" name="idPrestamo" required>
                                    <option value="">Cargando préstamos...</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="valorCuota" class="form-label fw-semibold">Valor de la Cuota ($ COP)</label>
                                <input type="number" step="0.01" min="100" class="form-control" id="valorCuota" name="valorCuota" placeholder="Ej: 150000" required>
                            </div>

                            <div class="mb-3">
                                <label for="fechaPago" class="form-label fw-semibold">Fecha de Pago</label>
                                <input type="date" class="form-control" id="fechaPago" name="fechaPago" required>
                            </div>

                            <button type="submit" class="btn btn-danger w-100 fw-semibold">
                                <i class="bi bi-check-circle me-1"></i> Guardar Pago
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Tabla de Historial de Pagos -->
            <div class="col-lg-8">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                        <h5 class="card-title mb-0">
                            <i class="bi bi-receipt me-1"></i> Comprobantes de Pagos Realizados
                        </h5>
                    </div>
                    <div class="card-body table-responsive p-0">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-secondary">
                                <tr>
                                    <th>ID Pago</th>
                                    <th>Préstamo</th>
                                    <th>Asociado</th>
                                    <th>Valor Pagado</th>
                                    <th>Fecha</th>
                                    <th id="thAccionesPagos">Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="tablaPagos">
                                <tr>
                                    <td colspan="6" class="text-center text-muted py-3">Cargando comprobantes...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../Controladores/registroPagos.js"></script>
</body>

</html>
