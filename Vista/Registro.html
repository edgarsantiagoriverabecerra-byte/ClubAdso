<html lang="es">
    <head>
        <meta charset="utf-8">
        <title>CLUB ADSO</title> 
        <link rel="stylesheet" href="../Assets/css/estilos.css">

    </head>

    <body>
        <div class="contenedor_formulario">
            <h2> Registro de Asociado - Acerias </h2>

            <form id="formRegistro" action="../Modelos/guardarAsociado.php" method="post">
                <div class="grupo-input">
                    <label> Ingresar Documento: </label>
                    <input id="Documento" name="documento" type="text" required placeholder="ejemplo: 1057000111">
                </div>

                <div class="grupo-input">
                    <label>Nombres: </label>
                    <input type="text" id="Nombre" name="nombre" required placeholder="Ingrese nombres completos">
                </div>

                 <div class="grupo-input">
                    <label>Apellidos: </label>
                    <input type="text" id="Apellido" name="apellido" required placeholder="Ingrese apellidos completos">
                </div>

                 <div class="grupo-input">
                    <label>Fecha de Nacimiento: </label>
                    <input type="date" id="fechaNacimiento" name="fechaNacimiento" required>
                </div>

                 <div class="grupo-input">
                    <label>Direccion de Residencia: </label>
                    <input type="text" id="direccionResidencia" name="direccionResidencia" required placeholder="Ejm: Calle">
                </div>

                 <div class="grupo-input">
                    <label>Ciudad: </label>
                    <select id="ciudad" name="ciudad" required>
                        <option value="Sogamoso">Sogamoso</option>
                        <option value="Duitama">Duitama</option>
                        <option value="Tunja">Tunja</option>
                    </select>
                </div>

                 <div class="grupo-input">
                    <label>Telefono: </label>
                    <input type="text" id="Telefono" name="telefono" required placeholder="3122478951">
                </div>

                  <div class="grupo-input">
                    <label>Email: </label>
                    <input type="email" id="Email" name="email" required placeholder="correo@ejemplo.com">
                </div>

                 <div class="grupo-input">
                    <label for="Password">Contraseña (mínimo 8 caracteres): </label>
                    <input type="password" id="Password" name="password" required minlength="8" autocomplete="new-password">
                </div>

                  <div class="grupo-input">
                    <label for="PasswordConfirm">Confirmar Contraseña (mínimo 8 caracteres): </label>
                    <input type="password" id="PasswordConfirm" name="password_confirm" required minlength="8" autocomplete="new-password">
                </div>

                 <div class="grupo-input">
                    <label>Genero: </label>

                    <label>
                        <input type="radio" id="masculino" name="genero" value="Masculino" required>
                        <span> Masculino</span>
                    </label>

                    <label>
                        <input type="radio" id="femenino" name="genero" value="Femenino">
                        <span> Femenino</span>
                    </label>

                     <label>
                        <input type="radio" id="otro" name="genero" value="Otro">
                        <span> Otro</span>
                    </label>
                </div>

                <div class="grupo-botones">
                    <button type="submit"> Guardar</button>
                    <button type="reset"> Limpiar Formulario</button>

                </div>
                <p id="mensajeRegistro" role="status" aria-live="polite"></p>
            </form>
            <p class="texto-link">
                ¿Ya tienes una cuenta? <a href="Login.html">Inicia sesión aquí</a>
            </p>

        </div>
    </body>
     <script src="../Controladores/Asociado.js"></script>
</html>
