<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLUB ADSO - Iniciar Sesión</title> 
    <link rel="stylesheet" href="../Assets/css/estilos.css">
</head>

<body>
    <div class="contenedor-registro">
        <h2>Iniciar Sesión - Acerías</h2>

        <form id="formLogin" action="../Modelos/iniciarSesion.php" method="post">
            <div class="grupo-input">
                <label for="Email">Correo Electrónico:</label>
                <input type="email" id="Email" name="email" required autocomplete="email" placeholder="correo@ejemplo.com">
            </div>

            <div class="grupo-input">
                <label for="Password">Contraseña:</label>
                <input type="password" id="Password" name="password" required autocomplete="current-password" placeholder="Ingrese su contraseña">
            </div>

            <div class="grupo-botones">
                <button type="submit">Ingresar</button>
                <button type="reset" class="btn-secundario">Cancelar</button>
            </div>
            
            <p class="texto-link">
                ¿No tienes una cuenta? <a href="Registro.html">Regístrate aquí</a>
            </p>
            <p id="mensajeLogin" role="status" aria-live="polite"></p>
        </form>
    </div>
</body>
<script src="../Controladores/login.js"></script>
</html>
