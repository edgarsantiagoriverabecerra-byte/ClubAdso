<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Préstamos - Club Acerías</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>

<body class="bg-light">
    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="text-danger fw-bold mb-0">Gestión de Préstamos</h3>
            <a href="dashboard.html" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left"></i> Volver al Panel
            </a>
        </div>

        <div id="mensajeAlerta" class="alert d-none" role="alert"></div>

        <div class="row g-4">
            <!-- Formulario de Registro -->
            <div class="col-lg-4">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-danger text-white">
                        <h5 class="card-title mb-0">
                            <i class="bi bi-cash-coin me-1"></i> Solicitar / Registrar Préstamo
                        </h5>
                    </div>
                    <div class="card-body">
                        <form id="formPrestamo">
                            <div class="mb-3" id="contenedorAsociado">
                                <label for="idAsociado" class="form-label fw-semibold">Asociado</label>
                                <select class="form-select" id="idAsociado" name="idAsociado" required>
                                    <option value="">Cargando asociados...</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="valorPrestamo" class="form-label fw-semibold">Valor del Préstamo ($ COP)</label>
                                <input type="number" step="0.01" min="1000" class="form-control" id="valorPrestamo" name="valorPrestamo" placeholder="Ej: 2000000" required>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="tasaInteres" class="form-label fw-semibold">Tasa (%)</label>
                                    <input type="number" step="0.01" min="0" max="100" class="form-control" id="tasaInteres" name="tasaInteres" value="0.25" readonly>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="numeroCuotas" class="form-label fw-semibold">N° Cuotas</label>
                                    <select class="form-select" id="numeroCuotas" name="numeroCuotas" required>
    <option value="6">6 Cuotas</option>
    <option value="12" selected>12 Cuotas</option>
    <option value="24">24 Cuotas</option>
    <option value="36">36 Cuotas</option>
</select>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="fechaPrestamo" class="form-label fw-semibold">Fecha del Préstamo</label>
                                <input type="date" class="form-control" id="fechaPrestamo" name="fechaPrestamo" required>
                            </div>

                            <button type="submit" class="btn btn-danger w-100 fw-semibold">
                                <i class="bi bi-save me-1"></i> Guardar Préstamo
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Tabla de Préstamos Registrados -->
            <div class="col-lg-8">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                        <h5 class="card-title mb-0">
                            <i class="bi bi-list-check me-1"></i> Historial de Créditos
                        </h5>
                    </div>
                    <div class="card-body table-responsive p-0">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-secondary">
                                <tr>
                                    <th>ID</th>
                                    <th>Asociado</th>
                                    <th>Valor</th>
                                    <th>Tasa</th>
                                    <th>Cuotas</th>
                                    <th>Fecha</th>
                                    <th id="thAccionesPrestamos">Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="tablaPrestamos">
                                <tr>
                                    <td colspan="7" class="text-center text-muted py-3">Cargando préstamos...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../Controladores/registroPrestamos.js"></script>
</body>

</html>
