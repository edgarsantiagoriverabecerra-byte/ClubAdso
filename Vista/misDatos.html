<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Datos - Club Acerías</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>

<body class="bg-light">
    <div class="container py-4" style="max-width: 900px;">
        <!-- Encabezado -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="text-primary fw-bold mb-0">
                    <i class="bi bi-person-vcard me-2"></i>Mis Datos Personales
                </h3>
                <small class="text-muted">Consulta y actualiza tu información registrada en la plataforma</small>
            </div>
            <a href="dashboard.html" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left me-1"></i> Volver al Panel
            </a>
        </div>

        <div id="mensajeAlerta" class="alert d-none" role="alert"></div>

        <!-- Tarjeta de Perfil Personal -->
        <div class="card shadow-sm border-0 mb-4">
            <div class="card-header bg-primary text-white py-3 d-flex justify-content-between align-items-center">
                <h5 class="card-title mb-0">
                    <i class="bi bi-person-badge me-2"></i>Ficha del Asociado
                </h5>
                <button type="button" class="btn btn-light btn-sm fw-semibold text-primary" id="btnEditarPerfil">
                    <i class="bi bi-pencil-square me-1"></i> Actualizar Mis Datos
                </button>
            </div>
            <div class="card-body p-4">
                <div class="row g-4">
                    <div class="col-md-6">
                        <label class="text-muted small text-uppercase fw-semibold d-block">Documento de Identidad</label>
                        <span id="perfilDocumento" class="fs-5 fw-bold text-dark">-</span>
                    </div>
                    <div class="col-md-6">
                        <label class="text-muted small text-uppercase fw-semibold d-block">Rol en el Club</label>
                        <span id="perfilRol" class="badge bg-primary fs-6">Asociado</span>
                    </div>

                    <div class="col-md-6">
                        <label class="text-muted small text-uppercase fw-semibold d-block">Nombres</label>
                        <span id="perfilNombres" class="fs-6 fw-semibold text-dark">-</span>
                    </div>
                    <div class="col-md-6">
                        <label class="text-muted small text-uppercase fw-semibold d-block">Apellidos</label>
                        <span id="perfilApellidos" class="fs-6 fw-semibold text-dark">-</span>
                    </div>

                    <div class="col-md-6">
                        <label class="text-muted small text-uppercase fw-semibold d-block">Fecha de Nacimiento</label>
                        <span id="perfilFechaNacimiento" class="fs-6 text-dark">-</span>
                    </div>
                    <div class="col-md-6">
                        <label class="text-muted small text-uppercase fw-semibold d-block">Género</label>
                        <span id="perfilGenero" class="fs-6 text-dark">-</span>
                    </div>

                    <div class="col-md-6">
                        <label class="text-muted small text-uppercase fw-semibold d-block">Ciudad de Residencia</label>
                        <span id="perfilCiudad" class="fs-6 text-dark">-</span>
                    </div>
                    <div class="col-md-6">
                        <label class="text-muted small text-uppercase fw-semibold d-block">Dirección de Residencia</label>
                        <span id="perfilDireccion" class="fs-6 text-dark">-</span>
                    </div>

                    <div class="col-md-6">
                        <label class="text-muted small text-uppercase fw-semibold d-block">Teléfono / Celular</label>
                        <span id="perfilTelefono" class="fs-6 text-dark">-</span>
                    </div>
                    <div class="col-md-6">
                        <label class="text-muted small text-uppercase fw-semibold d-block">Correo Electrónico</label>
                        <span id="perfilEmail" class="fs-6 text-dark">-</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para Editar Datos Personales -->
    <div class="modal fade" id="modalEditarMisDatos" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">Actualizar Mi Información Personal</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <form id="formActualizarMisDatos">
                    <div class="modal-body row g-3">
                        <input type="hidden" id="edit_idAsociado" name="idAsociado">

                        <div class="col-md-6">
                            <label for="edit_documento" class="form-label fw-semibold">Documento</label>
                            <input type="text" class="form-control" id="edit_documento" name="documento" required readonly>
                        </div>
                        <div class="col-md-6">
                            <label for="edit_fechaNacimiento" class="form-label fw-semibold">Fecha de Nacimiento</label>
                            <input type="date" class="form-control" id="edit_fechaNacimiento" name="fechaNacimiento" required>
                        </div>

                        <div class="col-md-6">
                            <label for="edit_nombres" class="form-label fw-semibold">Nombres</label>
                            <input type="text" class="form-control" id="edit_nombres" name="nombres" required>
                        </div>
                        <div class="col-md-6">
                            <label for="edit_apellidos" class="form-label fw-semibold">Apellidos</label>
                            <input type="text" class="form-control" id="edit_apellidos" name="apellidos" required>
                        </div>

                        <div class="col-md-6">
                            <label for="edit_genero" class="form-label fw-semibold">Género</label>
                            <select class="form-select" id="edit_genero" name="genero" required>
                                <option value="Masculino">Masculino</option>
                                <option value="Femenino">Femenino</option>
                                <option value="Otro">Otro</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="edit_ciudad" class="form-label fw-semibold">Ciudad</label>
                            <input type="text" class="form-control" id="edit_ciudad" name="ciudad" required>
                        </div>

                        <div class="col-md-6">
                            <label for="edit_telefono" class="form-label fw-semibold">Teléfono</label>
                            <input type="text" class="form-control" id="edit_telefono" name="telefono" required>
                        </div>
                        <div class="col-md-6">
                            <label for="edit_email" class="form-label fw-semibold">Correo Electrónico</label>
                            <input type="email" class="form-control" id="edit_email" name="email" required>
                        </div>

                        <div class="col-12">
                            <label for="edit_direccionResidencia" class="form-label fw-semibold">Dirección de Residencia</label>
                            <input type="text" class="form-control" id="edit_direccionResidencia" name="direccionResidencia" required>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Guardar Cambios</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../Controladores/misDatos.js?v=1"></script>
</body>

</html>
